spring.application.name=recourse
server.port=8080

# Embedded, file-based database: no separate server to run
spring.datasource.url=jdbc:h2:file:./data/recourse;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# Local language model (explanations only)
recourse.llm.enabled=true
recourse.llm.base-url=http://localhost:11434
recourse.llm.model=phi4-mini
recourse.llm.timeout-seconds=20

# Frontend dev server
recourse.cors.origins=http://localhost:5173
